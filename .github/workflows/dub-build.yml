name: Build project

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag"
        required: true
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dc: [ldc-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.dc }}

      - name: Build
        run: dub build --force -v --build=release

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin_file="xcbasic3.exe"
          else
            bin_file="xcbasic3"
          fi

          if [[ ! -f "$bin_file" ]]; then
            detected="$(ls -1 xcbasic3* 2>/dev/null | head -n 1 || true)"
            if [[ -z "$detected" ]]; then
              echo "Could not find built executable"
              exit 1
            fi
            bin_file="$detected"
          fi

          cp "$bin_file" out/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ runner.os }}
          path: out/xcbasic3*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries

      - name: Build release zips
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release

          for OS in Linux Windows macOS; do
            PKG_NAME="xcbasic3-${VERSION}-${OS}"
            PKG_DIR="release/${PKG_NAME}"

            mkdir -p "${PKG_DIR}/bin/${OS}"
            cp -r examples "${PKG_DIR}/examples"
            cp -r lib "${PKG_DIR}/lib"
            cp README.md LICENSE RELNOTES.md "${PKG_DIR}/"

            BIN_SRC="$(find "binaries/binary-${OS}" -maxdepth 1 -type f -name "xcbasic3*" | head -n 1 || true)"
            if [[ -z "${BIN_SRC}" ]]; then
              echo "Missing binary for ${OS}"
              exit 1
            fi
            cp "${BIN_SRC}" "${PKG_DIR}/bin/${OS}/"

            (cd release && zip -r "${PKG_NAME}.zip" "${PKG_NAME}")
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*.zip
          name: "Release ${{ github.event.inputs.version || github.ref }}"
          tag_name: ${{ github.event.inputs.version || github.ref }}
